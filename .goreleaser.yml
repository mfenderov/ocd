version: 2

builds:
  - id: ocd
    main: ./cmd/ocd
    binary: ocd
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    env: ["CGO_ENABLED=0"]
    ldflags:
      - -s -w
      - -X github.com/mfenderov/ocd/internal/boxadmin.Version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: ocd
    repository:
      owner: mfenderov
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/mfenderov/ocd"
    description: "Remote OpenCode access via Cloudflare Tunnel and Telegram bot"
    binaries:
      - ocd
    # Homebrew 7 deprecates `postflight` emitted by `hooks.post.install`.
    # Emit `postflight_steps` via custom_block until
    # goreleaser/goreleaser#6873 ships `hooks.post.install_steps`.
    # `chdir: "."` resolves to staged_path, keeps Homebrew `{{ }}` tokens
    # out of the goreleaser template.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "ocd"], chdir: "."
        end
      end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
