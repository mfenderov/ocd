name = "ocd-fleet"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "FLEET_STATE"
class_name = "FleetState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FleetState"]

# Task 3 console page: the static root ships with the Worker. Binding form
# (no automatic serving): /console is served by the Worker route from the
# bundled import so the Access gate cannot be bypassed via a direct asset
# path; the binding reserves explicit asset fetches for later.
[assets]
directory = "./static"
binding = "ASSETS"

[vars]
ENROLL_BASE_URL = "https://ocd-fleet.fenderovlol.workers.dev"
# Cloudflare Access browser bypass (Task 2): local-test defaults so the
# route-level valid-JWT test proves the env threading end-to-end
# (FleetState constructor -> accessConfig -> verifyAccessJwt).
# PROD MUST OVERRIDE all three before deploy: unset means deny-all
# fail-closed for browsers, and these test values must never go live.
ACCESS_TEAM_DOMAIN = "test-team.cloudflareaccess.com"
ACCESS_AUD = "test-access-aud-tag"
ACCESS_ALLOWED_EMAIL = "owner@example.com"
