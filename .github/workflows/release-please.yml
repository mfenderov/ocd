name: release-please

# Fully automatic tagging: on every master push, release-please reads
# conventional commits (feat:/fix:) since the last tag and opens or
# updates a "chore: release x.y.z" PR. Merging that PR creates the tag
# and the GitHub release notes, which fires the `release` workflow
# (goreleaser binaries + Homebrew cask + Worker deploy). The release-PR
# merge is the only human gate; everything after it is hands-free.
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: go
