name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: gofmt -l ./cmd ./internal ./scripts 2>/dev/null | grep . && exit 1 || true
      - run: go vet ./...
      - run: go test ./... -count=1
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: ./cmd/... ./internal/...

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3

  bump:
    name: bump version and trigger release
    needs: [go, worker, secrets]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Record latest tag
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
      - name: Auto bump version and tag
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          # --no-push: cocogotto pushes the version commit itself, and the
          # step below pushes it again — two pushes race for the same ref
          # and the release loses its tag. The step below pushes both the
          # commit and the tag, so let it own the push.
          args: --auto --no-push
          git-user: 'github-actions[bot]'
          git-user-email: 'github-actions[bot]@users.noreply.github.com'
      # Bot pushes made with GITHUB_TOKEN do not trigger push-event workflows,
      # but GITHUB_TOKEN with actions:write CAN trigger workflow_dispatch events.
      # We push the version commit and tag, then dispatch release.yml explicitly.
      - name: Push version commit and tag, then trigger release
        run: |
          BEFORE="${{ steps.before.outputs.tag }}"
          AFTER="$(git describe --tags --abbrev=0)"
          if [ "$AFTER" = "$BEFORE" ]; then
            echo "No new version — nothing to release."
          else
            # Rebase first: cocogotto may have pushed the version commit
            # itself, and a second push of the same ref loses the race and
            # takes the tag with it. After the rebase the push is either
            # the version commit or a no-op.
            git pull --rebase origin master
            git push origin master
            git push origin "$AFTER"
            echo "Triggering release workflow for $AFTER..."
            gh workflow run release.yml --ref "$AFTER"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
