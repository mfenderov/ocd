name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: gofmt -l ./cmd ./internal ./scripts 2>/dev/null | grep . && exit 1 || true
      - run: go vet ./...
      - run: go test ./... -count=1
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          args: ./cmd/... ./internal/...
      # The dead code: the functions the program never reaches. The gate
      # runs without -test, so a function only a test calls is dead too.
      # The tool exits zero whatever it finds, so the step fails on any
      # output.
      - name: the dead code
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          out="$(deadcode ./cmd/ocd)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "dead code found — remove it, or the gate fails"
            exit 1
          fi
      # The CRAP bar: no function may combine many paths with little
      # testing. CRAP is never below the complexity, so this is mostly a
      # statement about how big a function may be.
      - name: the CRAP bar
        run: |
          go install github.com/mfenderov/gocrap@v0.4.2
          go test -coverprofile=coverage.out ./...
          gocrap -c coverage.out -max 10 -exclude "*_test.go"

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run knip
      - run: npm test
      # The brain's own CRAP bar, with the TypeScript twin of gocrap.
      - name: the CRAP bar
        run: |
          npm run coverage
          npm run crap -- -c coverage/coverage-final.json -max 10

  tools:
    name: the tools (the CRAP tool measures itself)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run knip
      - run: npm run test:tools
      # The tool that applies the bar is held to the bar.
      - name: the tool measures itself
        run: npm run crap:self

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3

  bump:
    name: bump version and trigger release
    needs: [go, worker, tools, secrets]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Record latest tag
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
      - name: Auto bump version and tag
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          args: --auto
          git-user: 'github-actions[bot]'
          git-user-email: 'github-actions[bot]@users.noreply.github.com'
      # Bot pushes made with GITHUB_TOKEN do not trigger push-event workflows,
      # but GITHUB_TOKEN with actions:write CAN trigger workflow_dispatch events.
      # We push the version commit and tag, then dispatch release.yml explicitly.
      - name: Push version commit and tag, then trigger release
        run: |
          BEFORE="${{ steps.before.outputs.tag }}"
          AFTER="$(git describe --tags --abbrev=0)"
          if [ "$AFTER" = "$BEFORE" ]; then
            echo "No new version — nothing to release."
          else
            # Rebase first: cocogotto may have pushed the version commit
            # itself, and a second push of the same ref loses the race and
            # takes the tag with it. After the rebase the push is either
            # the version commit or a no-op.
            git pull --rebase origin master
            git push origin master
            git push origin "$AFTER"
            echo "Triggering release workflow for $AFTER..."
            gh workflow run release.yml --ref "$AFTER"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
