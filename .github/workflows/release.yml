name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). If omitted, uses the ref that triggered the workflow.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify release tag
        run: |
          EXACT_TAG="$(git describe --tags --exact-match 2>/dev/null || true)"
          if [ -z "$EXACT_TAG" ]; then
            echo "Error: HEAD ($(git rev-parse --short HEAD)) does not point to an exact git tag."
            echo "Provide a valid tag input (e.g. -f tag=v0.1.0) or trigger on a git tag ref."
            exit 1
          fi
          echo "Releasing verified tag: $EXACT_TAG"

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  worker:
    name: deploy worker
    runs-on: ubuntu-latest
    needs: release
    # Stable tags only: prereleases (v1.0.0-beta.1) ship binaries but do
    # not move the live fleet endpoint.
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  verify-assets:
    name: verify release downloads
    runs-on: ubuntu-latest
    needs: release
    # Every release proves its own artifacts: authenticated download of
    # each tarball (works for private repos too). A green release with
    # 404 assets failed the pipeline, never the user.
    steps:
      - name: Download every published archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VER="${TAG#v}"
          for OS in darwin linux; do
            for ARCH in amd64 arm64; do
              FILE="ocd_${VER}_${OS}_${ARCH}.tar.gz"
              URL="https://github.com/${REPO}/releases/download/${TAG}/${FILE}"
              echo "GET $URL"
              curl -sfSL -H "Authorization: Bearer $GH_TOKEN" -o /dev/null "$URL" || {
                echo "::error::download failed: $URL"
                exit 1
              }
            done
          done
          echo "4/4 archives download cleanly"
